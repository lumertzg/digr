name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install Rust components
        run: mise exec -- rustup component add rustfmt clippy
      - name: Formatting
        run: mise exec -- cargo fmt --check
      - name: Clippy
        run: mise exec -- cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: mise exec -- cargo test --locked
